<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屈折率・スネルの法則・レンズ光学シミュレーター</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div class="max-w-4xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center text-sky-300 mb-1">🔭 スネルの法則・レンズ光学シミュレーター</h1>
  <p class="text-center text-slate-500 mb-4 text-sm">屈折/全反射のリアルタイム描画とレンズ光学の可視化</p>

  <!-- Mode -->
  <div class="flex gap-2 mb-4 justify-center">
    <button onclick="setMode('snell')" id="mode-snell" class="px-4 py-2 rounded-lg bg-sky-800 text-sky-200 text-sm font-semibold" aria-label="スネルの法則">🌊 スネルの法則</button>
    <button onclick="setMode('convex')" id="mode-convex" class="px-4 py-2 rounded-lg bg-slate-700 text-slate-400 text-sm" aria-label="凸レンズ">🔍 凸レンズ</button>
    <button onclick="setMode('concave')" id="mode-concave" class="px-4 py-2 rounded-lg bg-slate-700 text-slate-400 text-sm" aria-label="凹レンズ">🔎 凹レンズ</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <!-- Controls -->
    <div class="bg-slate-800 rounded-xl p-4 space-y-4">
      <div id="snell-controls">
        <div class="text-xs text-slate-400 font-semibold mb-2">スネルの法則設定</div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">入射角 θ₁ (°): <span id="angle-val" class="text-sky-300"></span></label>
          <input type="range" id="angle" min="0" max="89" value="45" class="w-full accent-sky-500" oninput="update()" aria-label="入射角">
        </div>
        <div class="mt-3">
          <label class="text-xs text-slate-400 block mb-1">媒質1 (n₁)</label>
          <select id="n1" onchange="update()" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-xs text-white">
            <option value="1.0">真空/空気 (1.000)</option>
            <option value="1.33">水 (1.333)</option>
            <option value="1.5">ガラス (1.500)</option>
          </select>
        </div>
        <div class="mt-2">
          <label class="text-xs text-slate-400 block mb-1">媒質2 (n₂)</label>
          <select id="n2" onchange="update()" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1.5 text-xs text-white">
            <option value="1.33" selected>水 (1.333)</option>
            <option value="1.5">ガラス (1.500)</option>
            <option value="2.42">ダイヤモンド (2.420)</option>
            <option value="1.0">真空/空気 (1.000)</option>
          </select>
        </div>
      </div>
      <div id="lens-controls" class="hidden">
        <div class="text-xs text-slate-400 font-semibold mb-2">レンズ設定</div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">焦点距離 f (px): <span id="focal-val" class="text-sky-300"></span></label>
          <input type="range" id="focal" min="30" max="150" value="80" class="w-full accent-sky-500" oninput="update()" aria-label="焦点距離">
        </div>
        <div class="mt-2">
          <label class="text-xs text-slate-400 block mb-1">物体距離 d₀ (px): <span id="obj-val" class="text-sky-300"></span></label>
          <input type="range" id="obj-dist" min="20" max="200" value="120" class="w-full accent-sky-500" oninput="update()" aria-label="物体距離">
        </div>
      </div>

      <!-- Results -->
      <div id="calc-results" class="text-xs space-y-1 text-slate-300"></div>
    </div>

    <!-- Canvas -->
    <div class="md:col-span-2">
      <canvas id="optics-canvas" width="440" height="380" class="w-full rounded-xl bg-slate-900"></canvas>
    </div>
  </div>

  <!-- Reference -->
  <div class="mt-4 grid grid-cols-2 gap-3">
    <div class="bg-slate-800 rounded-xl p-3">
      <div class="text-xs font-semibold text-sky-300 mb-1">スネルの法則</div>
      <div class="text-xs text-slate-300">n₁ sin θ₁ = n₂ sin θ₂</div>
      <div class="text-xs text-slate-400 mt-1">全反射条件: n₁ &gt; n₂ かつ θ₁ &gt; arcsin(n₂/n₁)</div>
    </div>
    <div class="bg-slate-800 rounded-xl p-3">
      <div class="text-xs font-semibold text-sky-300 mb-1">薄レンズの公式</div>
      <div class="text-xs text-slate-300">1/f = 1/d₀ + 1/dᵢ</div>
      <div class="text-xs text-slate-400 mt-1">倍率: m = -dᵢ/d₀（負なら倒立）</div>
    </div>
  </div>
</div>

<script>
let currentMode = 'snell';

function setMode(m) {
  currentMode = m;
  ['snell','convex','concave'].forEach(id => {
    document.getElementById('mode-' + id).className = id===m
      ? 'px-4 py-2 rounded-lg bg-sky-800 text-sky-200 text-sm font-semibold'
      : 'px-4 py-2 rounded-lg bg-slate-700 text-slate-400 text-sm';
  });
  document.getElementById('snell-controls').classList.toggle('hidden', m !== 'snell');
  document.getElementById('lens-controls').classList.toggle('hidden', m === 'snell');
  update();
}

function update() {
  if (currentMode === 'snell') drawSnell();
  else drawLens(currentMode === 'convex');
}

function drawSnell() {
  const canvas = document.getElementById('optics-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);

  const angle1 = parseFloat(document.getElementById('angle').value);
  const n1 = parseFloat(document.getElementById('n1').value);
  const n2 = parseFloat(document.getElementById('n2').value);
  document.getElementById('angle-val').textContent = angle1 + '°';

  // Interface
  ctx.fillStyle='#1e3a5f80';
  ctx.fillRect(0,cy,W,cy);
  ctx.strokeStyle='#38bdf8'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.stroke();
  ctx.fillStyle='#38bdf8'; ctx.font='11px sans-serif'; ctx.textAlign='left';
  ctx.fillText('媒質1 n₁=' + n1, 8, cy-5);
  ctx.fillText('媒質2 n₂=' + n2, 8, cy+15);

  // Normal line
  ctx.strokeStyle='#64748b'; ctx.lineWidth=1; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(cx,10); ctx.lineTo(cx,H-10); ctx.stroke();
  ctx.setLineDash([]);

  // Incident ray
  const theta1 = angle1 * Math.PI / 180;
  const len = 160;
  ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx - len*Math.sin(theta1), cy - len*Math.cos(theta1));
  ctx.lineTo(cx, cy); ctx.stroke();
  // Arrow
  ctx.fillStyle='#fbbf24';
  ctx.beginPath(); ctx.arc(cx - len*Math.sin(theta1)/2, cy - len*Math.cos(theta1)/2, 4, 0, 2*Math.PI); ctx.fill();

  // Snell's law: n1 sin(θ1) = n2 sin(θ2)
  const sinTheta2 = (n1 * Math.sin(theta1)) / n2;
  const totalReflection = sinTheta2 >= 1;

  if (totalReflection) {
    // Total internal reflection
    ctx.strokeStyle='#ef4444'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + len*Math.sin(theta1), cy - len*Math.cos(theta1));
    ctx.stroke();
    ctx.fillStyle='#ef4444'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('全反射！', cx, cy - 20);
    document.getElementById('calc-results').innerHTML = `
      <div class="text-red-400 font-semibold">🔴 全反射発生</div>
      <div>θ₁ = ${angle1}°</div>
      <div>n₁sin θ₁ = ${(n1*Math.sin(theta1)).toFixed(3)}</div>
      <div>臨界角 = ${(Math.asin(n2/n1)*180/Math.PI).toFixed(1)}°</div>
    `;
  } else {
    const theta2 = Math.asin(sinTheta2);
    // Refracted ray
    ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + len*Math.sin(theta2), cy + len*Math.cos(theta2));
    ctx.stroke();
    // Reflected ray (partial)
    ctx.strokeStyle='#ef4444'; ctx.lineWidth=1; ctx.globalAlpha=0.4;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + len*Math.sin(theta1), cy - len*Math.cos(theta1));
    ctx.stroke();
    ctx.globalAlpha=1;

    // Angle arcs
    ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx,cy,40, -Math.PI/2, -Math.PI/2+theta1, false); ctx.stroke();
    ctx.strokeStyle='#60a5fa';
    ctx.beginPath(); ctx.arc(cx,cy,50, Math.PI/2-theta2, Math.PI/2, false); ctx.stroke();

    document.getElementById('calc-results').innerHTML = `
      <div class="text-yellow-300">入射角 θ₁ = ${angle1}°</div>
      <div class="text-blue-300">屈折角 θ₂ = ${(theta2*180/Math.PI).toFixed(2)}°</div>
      <div>n₁sin θ₁ = ${(n1*Math.sin(theta1)).toFixed(3)}</div>
      <div>n₂sin θ₂ = ${(n2*Math.sin(theta2)).toFixed(3)}</div>
      ${n1>n2?`<div class="text-orange-400">臨界角 = ${(Math.asin(n2/n1)*180/Math.PI).toFixed(1)}°</div>`:''}
    `;
  }
}

function drawLens(convex) {
  const canvas = document.getElementById('optics-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);

  const f = parseInt(document.getElementById('focal').value);
  const d0 = parseInt(document.getElementById('obj-dist').value);
  document.getElementById('focal-val').textContent = f + 'px';
  document.getElementById('obj-val').textContent = d0 + 'px';

  // Optical axis
  ctx.strokeStyle='#334155'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.stroke();

  // Lens
  const lh = 100;
  ctx.strokeStyle='#38bdf8'; ctx.lineWidth=2;
  if (convex) {
    ctx.beginPath();
    ctx.moveTo(cx,cy-lh);
    ctx.quadraticCurveTo(cx+15,cy,cx,cy+lh);
    ctx.quadraticCurveTo(cx-15,cy,cx,cy-lh);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx,cy-lh);
    ctx.quadraticCurveTo(cx-15,cy,cx,cy+lh);
    ctx.quadraticCurveTo(cx+15,cy,cx,cy-lh);
    ctx.stroke();
  }

  // Focal points
  const fSign = convex ? 1 : -1;
  [[cx+f*fSign,'F'],[cx-f*fSign,"F'"]].forEach(([x,label]) => {
    ctx.fillStyle='#fbbf24';
    ctx.beginPath(); ctx.arc(x,cy,4,0,2*Math.PI); ctx.fill();
    ctx.fillStyle='#fbbf24'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(label,x,cy+16);
  });

  // Object
  const objX = cx - d0;
  const objH = 50;
  ctx.strokeStyle='#4ade80'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(objX,cy); ctx.lineTo(objX,cy-objH); ctx.stroke();
  ctx.fillStyle='#4ade80';
  ctx.beginPath(); ctx.moveTo(objX,cy-objH); ctx.lineTo(objX-7,cy-objH+10); ctx.lineTo(objX+7,cy-objH+10); ctx.closePath(); ctx.fill();

  // Image calculation: 1/di = 1/f - 1/do
  const fEff = convex ? f : -f;
  const diInv = 1/fEff - 1/(-d0); // d0 is to the left (negative convention)
  const di = 1/diInv;
  const m = -di/d0;
  const imgX = cx + di;
  const imgH = objH * m;

  if (imgX >= 0 && imgX <= W) {
    ctx.strokeStyle = di > 0 ? '#f97316' : '#f97316';
    ctx.lineWidth=2; ctx.setLineDash(di<0?[4,4]:[]);
    ctx.beginPath(); ctx.moveTo(imgX,cy); ctx.lineTo(imgX,cy+imgH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#f97316';
    ctx.beginPath(); ctx.arc(imgX,cy,3,0,2*Math.PI); ctx.fill();
  }

  // Principal rays
  ctx.lineWidth=1.5;
  // Ray parallel to axis
  ctx.strokeStyle='#fbbf24'; ctx.globalAlpha=0.6;
  ctx.beginPath(); ctx.moveTo(objX,cy-objH); ctx.lineTo(cx,cy-objH); ctx.stroke();
  if(convex) { ctx.beginPath(); ctx.moveTo(cx,cy-objH); ctx.lineTo(cx+f,cy); ctx.stroke(); }
  // Ray through center
  ctx.strokeStyle='#ec4899';
  ctx.beginPath(); ctx.moveTo(objX,cy-objH); ctx.lineTo(cx+150,cy-objH*(1+150/d0)); ctx.stroke();
  ctx.globalAlpha=1;

  document.getElementById('calc-results').innerHTML = `
    <div>焦点距離 f = ${fEff}px</div>
    <div>物体距離 d₀ = ${d0}px</div>
    <div class="text-orange-300">像距離 dᵢ = ${di.toFixed(1)}px</div>
    <div>倍率 m = ${m.toFixed(2)}x</div>
    <div class="${di>0?'text-red-400':'text-purple-400'}">${di>0?'実像（倒立）':'虚像（正立）'}</div>
  `;
}

update();
</script>
</body>
</html>
